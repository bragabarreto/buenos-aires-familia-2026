document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x\">terça · o dia de céu aberto<\/span>\n          <span style=\"display: block; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; color: rgba(22,32,43,.45); margin-top: 6px\">Wikimedia Commons · CC BY 2.0<\/span>\n        <\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/section>\n\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"margin-bottom: 16px\">\n      <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0\">Os dez viajantes<\/h2>\n    <\/div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px\">\n      <sc-for list=\"{{ adultos }}\" as=\"v\" hint-placeholder-count=\"5\">\n        <span style=\"border: 1.5px solid #16202B; border-radius: 999px; padding: 7px 16px; background: rgba(14,92,70,.07); font-size: 15.5px; font-weight: 600\">{{ v.nome }}<\/span>\n      <\/sc-for>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px\">\n      <sc-for list=\"{{ criancas }}\" as=\"v\" hint-placeholder-count=\"5\">\n        <div style=\"border: 1.5px solid #16202B; border-radius: 11px; padding: 12px 14px; background: rgba(178,31,44,.06); display: flex; align-items: baseline; gap: 10px\">\n          <span style=\"font-family: 'Alfa Slab One', Georgia, serif; font-size: 24px; color: #B21F2C; font-variant-numeric: tabular-nums; line-height: 1\">{{ v.idade }}<\/span>\n          <span>\n            <b style=\"display: block; font-size: 15.5px\">{{ v.nome }}<\/b>\n            <span style=\"display: block; font-size: 12px; color: rgba(22,32,43,.66)\">{{ v.nasc }}<\/span>\n          <\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p style=\"background: rgba(196,137,42,.13); border-left: 4px solid #C4892A; border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 14px; margin: 16px 0 0\"><b style=\"color: #C4892A\">Correção que mexe em preço:<\/b> Sophia faz 13 em 19 de setembro, então viaja com <b>12 anos<\/b> — o relatório contava duas crianças de 13. Para o Temaikèn nada muda (a categoria de criança vai até 10), mas vale testar a gratuidade dela no Mundial del Alfajor e conferir a regra do Jardín Japonés, que fala em menores de 12. Miguel faz 7 em 30 de setembro: viaja com 6.<\/p>\n  <\/section>\n\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px\">\n      <div>\n        <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">A previsão manda no roteiro<\/h2>\n        <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">{{ climaFonte }}<\/p>\n      <\/div>\n      <button sc-camel-on-click=\"{{ recarregarClima }}\" class=\"naoimprime\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #FBF7EE; color: #16202B; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\" style-hover=\"background: #E6EEF3\">Atualizar agora<\/button>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px\">\n      <sc-for list=\"{{ clima }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 10px; padding: 10px 8px; text-align: center; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">\n          <b style=\"display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase\">{{ c.rot }}<\/b>\n          <span style=\"font-family: 'Alfa Slab One', serif; font-size: 17px; display: block; margin: 4px 0 2px; font-variant-numeric: tabular-nums\">{{ c.temp }}<\/span>\n          <span style=\"font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 7px; display: inline-block; background: {{ c.bg }}; color: {{ c.fg }}\">{{ c.label }}<\/span>\n          <span style=\"display: block; font-size: 10.5px; margin-top: 5px; color: rgba(22,32,43,.55)\">{{ c.origem }}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p style=\"background: rgba(196,137,42,.13); border-left: 4px solid #C4892A; border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 14px; margin: 16px 0 0\"><b style=\"color: #C4892A\">A trava:<\/b> domingo e segunda são os dois dias que não dá para mover — o Temaikèn fecha às terças no inverno e a feira de San Telmo só existe aos domingos. Por isso todo dia tem plano seco e plano de chuva embutidos, e a decisão é tomada na hora, olhando os números ao vivo aqui em cima. Onde o texto do roteiro citar a previsão, ele se refere à base fechada em 8 de agosto.<\/p>\n    <p style=\"background: rgba(27,79,156,.1); border-left: 4px solid #1B4F9C; border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 14px; margin: 12px 0 0\"><b style=\"color: #1B4F9C\">Frio de verdade:<\/b> máxima de 15° e sensação térmica caindo para 5–12°. Vindo de Fortaleza, esse é o erro clássico. Corta-vento, gorro e uma camada extra para as crianças.<\/p>\n  <\/section>\n\n  <sc-if value=\"{{ mostrarMapa }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px\">\n      <div>\n        <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">Onde cada dia acontece<\/h2>\n        <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Clique num ponto para ver o que é. Ao escolher um dia abaixo, o mapa acende só as paradas daquele dia.<\/p>\n      <\/div>\n      <button sc-camel-on-click=\"{{ verTudo }}\" class=\"naoimprime\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #FBF7EE; color: #16202B; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\" style-hover=\"background: #E6EEF3\">Mostrar tudo<\/button>\n    <\/div>\n    <div ref=\"{{ mapaRef }}\" style=\"height: 480px; border-radius: 10px; overflow: hidden; border: 1.5px solid #16202B; background: #DEEAF1\"><\/div>\n    <p style=\"font-size: 12px; color: rgba(22,32,43,.5); margin: 6px 0 0\">Mapa CARTO / OpenStreetMap · coordenadas reais de cada parada. Onde os pontos ficam muito próximos, o nome aparece ao passar o mouse; clique no marcador para ver o detalhe.<\/p>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 14px; font-size: 13px\">\n      <span style=\"display: inline-flex; align-items: center; gap: 7px\"><i style=\"width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #16202B; display: inline-block; background: #B21F2C\"><\/i> âncora do dia<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 7px\"><i style=\"width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #16202B; display: inline-block; background: #C4892A\"><\/i> passeio ao ar livre<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 7px\"><i style=\"width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #16202B; display: inline-block; background: #1B4F9C\"><\/i> coberto — serve de plano de chuva<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 7px\"><i style=\"width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #16202B; display: inline-block; background: #16202B\"><\/i> base<\/span>\n    <\/div>\n    <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin-top: 12px; min-height: 20px\">{{ pinInfo }}<\/p>\n  <\/section>\n  <\/sc-if>\n\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"margin-bottom: 14px\">\n      <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">Dia a dia<\/h2>\n      <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Tudo é editável: adicione paradas, apague o que não quiser e escreva suas notas. Fica salvo neste navegador.<\/p>\n    <\/div>\n\n    <div class=\"naoimprime\" style=\"display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px\">\n      <sc-for list=\"{{ dias }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"flex: 0 0 auto; border: 1.5px solid #16202B; border-radius: 10px; padding: 9px 15px; cursor: pointer; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 600; box-shadow: 0 2px 0 rgba(22,32,43,.1); text-align: left; background: {{ d.bg }}; color: {{ d.fg }}\">\n          {{ d.tab }}<small style=\"display: block; font-weight: 500; font-size: 11.5px; opacity: .68\">{{ d.eixo }}<\/small>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; border-bottom: 2px solid #16202B; padding-bottom: 16px; margin-bottom: 18px\">\n      <div style=\"flex: 1 1 240px\">\n        <p style=\"margin: 0 0 4px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: #0E5C46\">{{ diaCabecalho }}<\/p>\n        <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(24px, 4vw, 34px); color: #0E5C46; margin: 0\">{{ diaEixo }}<\/h2>\n        <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); max-width: 56ch; margin: 8px 0 0; text-wrap: pretty\">{{ diaResumo }}<\/p>\n      <\/div>\n      <span style=\"margin-left: auto; font-size: 12.5px; font-weight: 600; border: 1.5px solid #16202B; border-radius: 999px; padding: 4px 12px; background: #D5E3EC\">{{ diaIntensidade }}<\/span>\n    <\/div>\n\n    <sc-if value=\"{{ diaDivergiu }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"background: rgba(27,79,156,.1); border-left: 4px solid #1B4F9C; border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 14px; margin: 0 0 16px\">{{ diaDivergiu }}<\/p>\n    <\/sc-if>\n\n    <div class=\"naoimprime\" style=\"display: inline-flex; border: 1.5px solid #16202B; border-radius: 999px; overflow: hidden; margin: 0 0 16px; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">\n      <button sc-camel-on-click=\"{{ verSeco }}\" style=\"border: 0; font-family: Archivo, sans-serif; font-size: 13px; font-weight: 600; padding: 7px 15px; cursor: pointer; background: {{ secoBg }}; color: {{ secoFg }}\">☀ Plano seco<\/button>\n      <button sc-camel-on-click=\"{{ verChuva }}\" style=\"border: 0; font-family: Archivo, sans-serif; font-size: 13px; font-weight: 600; padding: 7px 15px; cursor: pointer; background: {{ chuvaBg }}; color: {{ chuvaFg }}\">☂ Plano de chuva<\/button>\n    <\/div>\n\n    <ol style=\"list-style: none; margin: 0; padding: 0 0 0 30px; position: relative\">\n      <li style=\"position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2.5px; background: repeating-linear-gradient(#16202B 0 7px, transparent 7px 13px)\"><\/li>\n      <sc-for list=\"{{ paradas }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <li style=\"position: relative; padding: 0 0 20px\">\n          <i style=\"position: absolute; left: -27px; top: 6px; width: 15px; height: 15px; border-radius: 50%; background: #FBF7EE; border: 2.5px {{ s.dotStyle }} {{ s.cor }}\"><\/i>\n          <div style=\"font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: {{ s.cor }}\">{{ s.h }}<\/div>\n          <h4 style=\"margin: 1px 0 3px; font-size: 17.5px; font-family: Archivo, sans-serif; font-weight: 700\">{{ s.t }}<sc-if value=\"{{ s.p }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display: inline-block; background: #D5E3EC; border: 1px solid rgba(22,32,43,.16); border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin-left: 6px; vertical-align: 1px\">{{ s.p }}<\/span><\/sc-if><\/h4>\n          <p style=\"margin: 0; font-size: 14.5px; color: rgba(22,32,43,.82); text-wrap: pretty\">{{ s.d }}<\/p>\n          <div style=\"margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px\">\n            <a href=\"{{ s.mapa }}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 600; text-decoration: none; border-bottom: 1.5px solid rgba(27,79,156,.35)\">Abrir no mapa ↗<\/a>\n            <sc-if value=\"{{ s.custom }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ s.onDel }}\" class=\"naoimprime\" style=\"border: 0; background: none; color: #B21F2C; font-family: Archivo, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline\">Remover<\/button>\n            <\/sc-if>\n          <\/div>\n        <\/li>\n      <\/sc-for>\n    <\/ol>\n\n    <div class=\"naoimprime\" style=\"display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0 30px\">\n      <input type=\"text\" placeholder=\"Horário\" value=\"{{ novoH }}\" sc-camel-on-change=\"{{ setNovoH }}\" style=\"flex: 0 0 92px; font-family: Archivo, sans-serif; font-size: 14px; color: #16202B; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 11px\">\n      <input type=\"text\" placeholder=\"Nova parada\" value=\"{{ novoT }}\" sc-camel-on-change=\"{{ setNovoT }}\" style=\"flex: 1 1 150px; min-width: 110px; font-family: Archivo, sans-serif; font-size: 14px; color: #16202B; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 11px\">\n      <input type=\"text\" placeholder=\"Observação (opcional)\" value=\"{{ novoD }}\" sc-camel-on-change=\"{{ setNovoD }}\" style=\"flex: 1 1 150px; min-width: 110px; font-family: Archivo, sans-serif; font-size: 14px; color: #16202B; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 11px\">\n      <button sc-camel-on-click=\"{{ addParada }}\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #16202B; color: #FBF7EE; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">Adicionar<\/button>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px\">\n      <sc-for list=\"{{ fotos }}\" as=\"ft\" hint-placeholder-count=\"2\">\n        <figure style=\"margin: 0; border: 1.5px solid #16202B; border-radius: 12px; overflow: hidden; background: #FBF7EE\">\n          <img src=\"{{ ft.src }}\" alt=\"{{ ft.t }}\" loading=\"lazy\" onerror=\"this.style.display='none';this.parentNode.style.background='repeating-linear-gradient(45deg,#D5E3EC 0 10px,#E6EEF3 10px 20px)'\" style=\"display: block; width: 100%; height: 150px; object-fit: cover; border-bottom: 1.5px solid #16202B\">\n          <figcaption style=\"padding: 9px 11px\">\n            <b style=\"display: block; font-size: 14px; line-height: 1.2\">{{ ft.t }}<\/b>\n            <span style=\"display: block; font-size: 10px; font-family: ui-monospace, Menlo, monospace; color: rgba(22,32,43,.45); margin-top: 5px\">{{ ft.c }}<\/span>\n          <\/figcaption>\n        <\/figure>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"margin-top: 20px; border: 1.5px solid #1B4F9C; border-radius: 12px; background: rgba(27,79,156,.06); padding: 16px\">\n      <p style=\"margin: 0 0 4px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #1B4F9C\">☂ Se chover — coberto e perto<\/p>\n      <p style=\"margin: 0 0 12px; font-size: 13.5px; color: rgba(22,32,43,.7)\">{{ cobertoNota }}<\/p>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{ coberto }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 10px; padding: 11px 13px\">\n            <b style=\"display: block; font-size: 14.5px; margin-bottom: 2px\">{{ c.t }}<\/b>\n            <span style=\"font-size: 13px; color: rgba(22,32,43,.75)\">{{ c.d }}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n\n    <sc-if value=\"{{ diaAviso }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"background: rgba(196,137,42,.13); border-left: 4px solid #C4892A; border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 14px; margin: 18px 0 0\">{{ diaAviso }}<\/p>\n    <\/sc-if>\n\n    <div style=\"margin-top: 18px\">\n      <label style=\"display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #0E5C46; margin-bottom: 6px\">Suas anotações para este dia<\/label>\n      <textarea placeholder=\"Reservas confirmadas, telefones, quem paga o quê, o que as crianças pediram…\" value=\"{{ nota }}\" sc-camel-on-change=\"{{ setNota }}\" style=\"width: 100%; min-height: 84px; background: #fff; border: 1.5px dashed #16202B; border-radius: 10px; padding: 12px 14px; font-size: 14.5px; font-family: Archivo, sans-serif; color: #16202B; resize: vertical\"><\/textarea>\n      <sc-if value=\"{{ temNotasFamilia }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top: 14px; border-left: 4px solid #0E5C46; background: rgba(14,92,70,.07); border-radius: 0 10px 10px 0; padding: 12px 14px\">\n          <p style=\"margin: 0 0 9px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #0E5C46\">Anotações da família<\/p>\n          <sc-for list=\"{{ notasFamilia }}\" as=\"n\" hint-placeholder-count=\"2\">\n            <div style=\"margin-bottom: 9px\">\n              <b style=\"font-size: 13.5px\">{{ n.quem }}<\/b>\n              <span style=\"font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: rgba(22,32,43,.45); margin-left: 6px\">{{ n.em }}<\/span>\n              <p style=\"margin: 2px 0 0; font-size: 14px; color: rgba(22,32,43,.85); white-space: pre-wrap\">{{ n.texto }}<\/p>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/section>\n\n  <sc-if value=\"{{ mostrarCustos }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px\">\n      <div>\n        <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">Quanto custa<\/h2>\n        <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Só ingressos — desmarque o que não for fazer. Transporte e transfers estão no bloco acima, já pagos.<\/p>\n      <\/div>\n      <label style=\"display: flex; align-items: center; gap: 9px; font-size: 13px\">Cotação ARS→BRL\n        <input type=\"number\" step=\"0.0001\" min=\"0\" value=\"{{ cambio }}\" sc-camel-on-change=\"{{ setCambio }}\" style=\"width: 96px; font-family: Archivo, sans-serif; font-size: 14px; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 6px 9px; color: #16202B\">\n      <\/label>\n    <\/div>\n    <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14.5px\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"width: 34px; border-bottom: 2px solid #16202B; padding: 0 6px 7px\"><\/sc-raw-th>\n          <sc-raw-th style=\"text-align: left; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #0E5C46; border-bottom: 2px solid #16202B; padding: 0 6px 7px\">Item<\/sc-raw-th>\n          <sc-raw-th style=\"text-align: right; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #0E5C46; border-bottom: 2px solid #16202B; padding: 0 6px 7px\">ARS<\/sc-raw-th>\n        <\/sc-raw-tr>\n      <\/sc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ custos }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <sc-raw-tr style=\"opacity: {{ c.op }}\">\n            <sc-raw-td style=\"border-bottom: 1px solid rgba(22,32,43,.16); padding: 9px 6px\"><input type=\"checkbox\" checked=\"{{ c.on }}\" sc-camel-on-change=\"{{ c.onToggle }}\" style=\"width: 17px; height: 17px; accent-color: #0E5C46; cursor: pointer\"><\/sc-raw-td>\n            <sc-raw-td style=\"border-bottom: 1px solid rgba(22,32,43,.16); padding: 9px 6px\">{{ c.n }}<\/sc-raw-td>\n            <sc-raw-td style=\"border-bottom: 1px solid rgba(22,32,43,.16); padding: 9px 6px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums\">\n              <sc-if value=\"{{ c.edit }}\" hint-placeholder-val=\"{{ false }}\">\n                <input type=\"number\" min=\"0\" step=\"1000\" value=\"{{ c.v }}\" placeholder=\"{{ c.ph }}\" sc-camel-on-change=\"{{ c.onValor }}\" style=\"width: 120px; text-align: right; font-family: Archivo, sans-serif; font-size: 14px; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 5px 8px; color: #16202B\">\n              <\/sc-if>\n              <sc-if value=\"{{ c.fixo }}\" hint-placeholder-val=\"{{ true }}\">{{ c.vf }}<\/sc-if>\n            <\/sc-raw-td>\n          <\/sc-raw-tr>\n        <\/sc-for>\n      <\/sc-raw-tbody>\n    <\/sc-raw-table>\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 2.5px solid #16202B\">\n      <span style=\"font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #0E5C46\">Total de ingressos ainda a pagar<\/span>\n      <div style=\"text-align: right\">\n        <div style=\"font-family: 'Alfa Slab One', serif; font-size: clamp(26px, 5vw, 38px); color: #B21F2C; font-variant-numeric: tabular-nums\">{{ totalArs }}<\/div>\n        <div style=\"font-size: 15px; font-weight: 600; opacity: .7; font-variant-numeric: tabular-nums\">{{ totalBrl }}<\/div>\n      <\/div>\n    <\/div>\n    <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin-top: 12px\">Não inclui alimentação nem táxis do dia a dia. Fora da conta porque já estão pagos: Maravillosa Alicia, Buenos Aires Bus, transfers do aeroporto e o transfer do Temaikèn.<\/p>\n  <\/section>\n  <\/sc-if>\n\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"margin-bottom: 16px\">\n      <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">Transporte do grupo<\/h2>\n      <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Quase tudo já está pago. Falta um trecho só — e ele é o de chegada.<\/p>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px\">\n      <div style=\"border: 1.5px solid #16202B; border-radius: 12px; padding: 16px; background: rgba(14,92,70,.07)\">\n        <p style=\"margin: 0 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #0E5C46\">Já pago<\/p>\n        <ul style=\"margin: 0; padding-left: 18px; font-size: 14.5px; display: grid; gap: 7px\">\n          <li>Transfers do aeroporto, ida e volta — <b>R$ 160 por pessoa<\/b>, cobrindo o retorno ao aeroporto na volta e a ida e volta do Temaikèn.<\/li>\n          <li>Buenos Aires Bus — <b>ARS 613.333<\/b> pelo grupo, rateados a 61.333 por pessoa.<\/li>\n          <li>Maravillosa Alicia, sábado 19h.<\/li>\n        <\/ul>\n      <\/div>\n\n      <div style=\"border: 1.5px solid #B21F2C; border-radius: 12px; padding: 16px; background: rgba(178,31,44,.07)\">\n        <p style=\"margin: 0 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #B21F2C\">O único trecho em aberto<\/p>\n        <p style=\"margin: 0 0 8px; font-size: 14.5px\">Chegada em <b>Aeroparque<\/b> → Fitz Roy 2428, para <b>4 pessoas<\/b>: 3 adultos e 1 criança de 13 anos.<\/p>\n        <p style=\"margin: 0; font-size: 13.5px; color: rgba(22,32,43,.72)\">Na volta, dia 19, <b>os dez saem por Ezeiza<\/b> — o transfer contratado cobre 6 e precisa ser ampliado. Aeroparque fica a cerca de 15 minutos de Palermo, então um único carro grande ou dois táxis resolvem.<\/p>\n      <\/div>\n\n      <div style=\"border: 1.5px solid #16202B; border-radius: 12px; padding: 16px; background: #D5E3EC\">\n        <p style=\"margin: 0 0 8px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #1B4F9C\">Ônibus turístico · rateado por pessoa<\/p>\n        <ul style=\"margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 6px; font-variant-numeric: tabular-nums\">\n          <li>ARS <b>61.333<\/b> por pessoa × 10 = <b>ARS 613.333<\/b><\/li>\n          <li>Já pago, junto com os demais transfers.<\/li>\n        <\/ul>\n        <p style=\"margin: 8px 0 0; font-size: 13px; color: rgba(22,32,43,.72)\">Critério adotado: rateio individual. A leitura por bloco fechado de 3 daria ARS 736.000 — ARS 122.667 a mais. Se o comprovante vier pelo valor cheio, é essa a diferença a questionar.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px\">\n      <div>\n        <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">O que resolver antes de embarcar<\/h2>\n        <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Em ordem de urgência. Marque conforme for fechando.<\/p>\n      <\/div>\n      <button sc-camel-on-click=\"{{ limparTarefas }}\" class=\"naoimprime\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #FBF7EE; color: #16202B; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">Limpar tudo<\/button>\n    <\/div>\n    <ul style=\"list-style: none; margin: 0; padding: 0\">\n      <sc-for list=\"{{ tarefas }}\" as=\"t\" hint-placeholder-count=\"11\">\n        <li style=\"display: flex; gap: 11px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid rgba(22,32,43,.16)\">\n          <input type=\"checkbox\" checked=\"{{ t.on }}\" sc-camel-on-change=\"{{ t.onToggle }}\" style=\"width: 19px; height: 19px; margin-top: 2px; accent-color: #B21F2C; cursor: pointer; flex: 0 0 auto\">\n          <label style=\"font-size: 14.5px; text-decoration: {{ t.deco }}; opacity: {{ t.op }}\">\n            <span style=\"display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1B4F9C\">{{ t.p }}<\/span>{{ t.t }}<sc-if value=\"{{ t.temQuem }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display: block; font-size: 11.5px; color: #0E5C46; font-weight: 600; margin-top: 2px\">✓ já feito por {{ t.quem }}<\/span><\/sc-if>\n          <\/label>\n        <\/li>\n      <\/sc-for>\n    <\/ul>\n  <\/section>\n\n  \n  <section style=\"background: #FBF7EE; border: 1.5px solid #16202B; border-radius: 14px; box-shadow: 4px 4px 0 rgba(22,32,43,.12); padding: 22px; margin: 26px 0\">\n    <div style=\"margin-bottom: 14px\">\n      <h2 style=\"font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 4px\">Juntar as anotações de todo mundo<\/h2>\n      <p style=\"font-size: 13.5px; color: rgba(22,32,43,.68); margin: 2px 0 0\">Cada pessoa anota no próprio navegador. Para reunir tudo: você gera um código, manda no grupo, e quem recebe cola aqui. Não passa por servidor nenhum — os dados da família não ficam expostos na internet.<\/p>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n\n      <div style=\"border: 1.5px solid #16202B; border-radius: 12px; padding: 15px; background: rgba(196,137,42,.08)\">\n        <p style=\"margin: 0 0 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #C4892A\">1 · Mandar as minhas<\/p>\n        <input type=\"text\" placeholder=\"Seu nome\" value=\"{{ pessoa }}\" sc-camel-on-change=\"{{ setPessoa }}\" style=\"font-family: Archivo, sans-serif; font-size: 14px; color: #16202B; background: #fff; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 11px; width: 100%; margin-bottom: 9px\">\n        <button sc-camel-on-click=\"{{ gerar }}\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #16202B; color: #FBF7EE; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">Gerar meu código<\/button>\n        <sc-if value=\"{{ temCodigo }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea readonly=\"{{ true }}\" value=\"{{ codigo }}\" style=\"width: 100%; margin-top: 10px; min-height: 74px; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; border: 1.5px dashed #16202B; border-radius: 9px; padding: 9px; background: #fff; color: rgba(22,32,43,.7); resize: vertical\"><\/textarea>\n        <\/sc-if>\n      <\/div>\n\n      <div style=\"border: 1.5px solid #16202B; border-radius: 12px; padding: 15px; background: rgba(27,79,156,.07)\">\n        <p style=\"margin: 0 0 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #1B4F9C\">2 · Receber as dos outros<\/p>\n        <textarea placeholder=\"Cole aqui o código que te mandaram\" value=\"{{ colar }}\" sc-camel-on-change=\"{{ setColar }}\" style=\"width: 100%; min-height: 74px; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; border: 1.5px solid #16202B; border-radius: 9px; padding: 9px; background: #fff; color: #16202B; resize: vertical; margin-bottom: 9px\"><\/textarea>\n        <button sc-camel-on-click=\"{{ juntar }}\" style=\"font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #16202B; color: #FBF7EE; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">Juntar ao quadro<\/button>\n      <\/div>\n    <\/div>\n\n    <sc-if value=\"{{ temAviso }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"background: rgba(14,92,70,.12); border-left: 4px solid #0E5C46; border-radius: 0 9px 9px 0; padding: 10px 13px; font-size: 13.5px; margin: 14px 0 0\">{{ aviso }}<\/p>\n    <\/sc-if>\n\n    <sc-if value=\"{{ temEquipe }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top: 18px\">\n        <p style=\"margin: 0 0 9px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #0E5C46\">Já estão no quadro<\/p>\n        <sc-for list=\"{{ equipe }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(22,32,43,.16)\">\n            <div style=\"flex: 1 1 auto\">\n              <b style=\"font-size: 14.5px\">{{ p.quem }}<\/b>\n              <span style=\"display: block; font-size: 12.5px; color: rgba(22,32,43,.6)\">{{ p.resumo }}<\/span>\n            <\/div>\n            <button sc-camel-on-click=\"{{ p.remover }}\" class=\"naoimprime\" style=\"border: 0; background: none; color: #B21F2C; font-family: Archivo, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: underline\">Tirar<\/button>\n          <\/div>\n        <\/sc-for>\n        <p style=\"font-size: 13px; color: rgba(22,32,43,.62); margin: 12px 0 0\">As anotações de cada pessoa aparecem no dia correspondente, logo abaixo do seu campo. Ninguém sobrescreve ninguém.<\/p>\n      <\/div>\n    <\/sc-if>\n  <\/section>\n\n  <footer style=\"text-align: center; font-size: 13px; color: rgba(22,32,43,.6); padding: 34px 0 0; border-top: 1.5px solid rgba(22,32,43,.16); margin-top: 34px\">\n    Montado a partir de fontes oficiais: Turismo Buenos Aires, Ministério de Cultura da Cidade, Fundación Temaikèn, Jardín Japonés, Planetario Galileo Galilei, Teatro Colón e Climatempo. Previsão ao vivo por Open-Meteo.<br>\n    <span>{{ carimbo }}<\/span><br>\n    <button sc-camel-on-click=\"{{ imprimir }}\" class=\"naoimprime\" style=\"margin-top: 14px; font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 600; background: #FBF7EE; color: #16202B; border: 1.5px solid #16202B; border-radius: 9px; padding: 8px 15px; cursor: pointer; box-shadow: 0 2px 0 rgba(22,32,43,.1)\">Imprimir ou salvar em PDF<\/button>\n  <\/footer>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarMapa&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;},&quot;mostrarCustos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nconst CARMIN = '#B21F2C', COBALTO = '#1B4F9C', VERDE = '#0E5C46', OURO = '#C4892A', TINTA = '#16202B', CREME = '#FBF7EE';\n\nconst DIAS = [\n {id:14, dow:'Sexta', data:'14 ago', iso:'2026-08-14', eixo:'Chegada e Palermo', intensidade:'Baixa', clima:'8–12° · ver ao vivo',\n  resumo:'Nada com hora marcada. São dez pessoas que acabaram de voar de Fortaleza — o dia é de aterrissar na cidade.',\n  seco:[\n   {h:'~12h', t:'Chegada em dois aeroportos', d:'Seis pessoas chegam por Ezeiza, com transfer já pago. Quatro chegam por Aeroparque — 3 adultos e 1 criança de 13 anos — e esse é o único trecho ainda em aberto. Depois, check-in e tarde livre no apartamento.', m:'Fitz Roy 2428 Palermo Buenos Aires'},\n   {h:'~16h30', t:'Palermo Soho a pé', d:'Plaza Serrano/Cortázar, ruas Honduras e Gorriti. Primeiro contato sem compromisso.', m:'Plaza Serrano Palermo Soho Buenos Aires'},\n   {h:'Jantar · 20h', t:'Rails — o jantar dos trens', d:'Nicaragua 6055, a duas quadras do apartamento. Comida e bebida chegam à mesa em trens de escala; 4,5 no Google, com hambúrgueres e sobremesas como destaque e ambiente feito para ir com crianças. Reserve pelo hacetureserva.com escolhendo data, horário e \"más de 6 personas\" — com dez pessoas, reservar é obrigatório. Uma ressalva das avaliações: a comida às vezes chega fria.', p:'reserva online', m:'Rails Nicaragua 6055 Palermo Buenos Aires'},\n   {h:'Alternativa', t:'Ninina ou Pastasole', d:'Ninina (Gorriti 4738), padaria e brunch. Pastasole (Fitz Roy 1947), massas a cinco quadras. Ambos ARS 10–20 mil por pessoa.', o:true, m:'Ninina Gorriti 4738 Buenos Aires'},\n   {h:'Opção', t:'Calden del Soho Grill', d:'Se quiserem a primeira refeição argentina completa. ARS 30–80 mil por pessoa.', o:true, m:'Calden del Soho Grill Palermo'}\n  ],\n  chuva:[\n   {h:'~12h', t:'Chegada e check-in', d:'Sem alteração — dia previsto seco de qualquer forma.', m:'Fitz Roy 2428 Palermo Buenos Aires'},\n   {h:'Tarde', t:'Mercado de Palermo coberto', d:'Se der chuva inesperada, a área de Gorriti e Armenia tem galerias e cafés cobertos suficientes para a tarde.', m:'Palermo Soho Buenos Aires'}\n  ],\n  aviso:'Compre chip ou eSIM ainda no aeroporto e leve pesos em espécie para o primeiro dia. Muitos lugares em Palermo aceitam cartão, mas a feira e o mercado, não.'},\n\n {id:15, dow:'Sábado', data:'15 ago', iso:'2026-08-15', eixo:'Panorâmica + Alicia', intensidade:'Média', clima:'10–14° · ver ao vivo',\n  resumo:'Um dia com duas âncoras: o ônibus turístico de manhã e Alicia à noite. Nada entre 17h e 19h.',\n  seco:[\n   {h:'~9h30', t:'Buenos Aires Bus', d:'Embarque em Palermo. Hop-on/hop-off com audioguia em nove idiomas.', m:'Buenos Aires Bus Plaza Italia'},\n   {h:'~12h30', t:'Uma única descida: Caminito', d:'Cerca de 1h em La Boca. Resolve Caminito e libera a terça-feira para outra coisa.', m:'Caminito La Boca Buenos Aires'},\n   {h:'~16h30', t:'Volta a Palermo e descanso', d:'Descanso obrigatório antes da noite. Não encaixe nada aqui.', m:'Fitz Roy 2428 Palermo'},\n   {h:'19h', t:'Maravillosa Alicia', d:'Jardín Botánico, Av. Santa Fe 3951. Percurso noturno com 12 instalações imersivas. Ingresso já comprado.', p:'já pago', m:'Jardin Botanico Carlos Thays Buenos Aires'},\n   {h:'Opção', t:'Planetário · Top 5 do universo', d:'Espetáculo para 6 a 10 anos, sábados e domingos às 17h30, a 10 min a pé do Botânico. Encaixa, mas deixa o dia sem respiro.', o:true, p:'ARS 12.000/pes.', m:'Planetario Galileo Galilei Buenos Aires'}\n  ],\n  chuva:[\n   {h:'~10h', t:'Bus só no andar de baixo', d:'O andar superior é aberto. Com vento e 10°, fiquem embaixo em parte do trajeto.', m:'Buenos Aires Bus Plaza Italia'},\n   {h:'~13h', t:'Trocar Caminito por Colón Fábrica', d:'Se chover forte, Caminito perde a graça. Colón Fábrica fica na mesma região e é coberto.', m:'Colon Fabrica Av Don Pedro de Mendoza 2163'},\n   {h:'19h', t:'Maravillosa Alicia', d:'Confirme com a organização se há política de remarcação por chuva — o percurso é ao ar livre.', p:'já pago', m:'Jardin Botanico Carlos Thays Buenos Aires'}\n  ],\n  aviso:'O preço do passe de estrangeiro só aparece no site oficial depois de selecionar a data. Faça isso com 15/08 escolhido — não confie em valores de terceiros.'},\n\n {id:16, dow:'Domingo', data:'16 ago', iso:'2026-08-16', eixo:'San Telmo + Día del Niño', intensidade:'Média', clima:'12–15° · ver ao vivo',\n  resumo:'Na previsão de 8 de agosto era o dia mais chuvoso do mês, com pancadas rápidas em vez de temporal. A manhã inteira tem cobertura a poucos passos, então funciona nos dois cenários — confira o painel acima para ver como está a leitura ao vivo.',\n  seco:[\n   {h:'10h/10h30', t:'Mafalda, Susanita e Manolito', d:'Esquina de Chile com Defensa, início do Paseo de la Historieta.', m:'Estatua Mafalda Chile y Defensa San Telmo'},\n   {h:'~11h', t:'Paseo de la Historieta + Feria', d:'Isidoro Cañones, Larguirucho, Super Hijitus. Depois Calle Defensa até a Plaza Dorrego.', m:'Feria de San Telmo Plaza Dorrego'},\n   {h:'~12h30', t:'Mercado de San Telmo', d:'Coberto, 9h às 20h. Almoço por escolha individual — dez pessoas sem sentar duas horas à mesa.', m:'Mercado de San Telmo Buenos Aires'},\n   {h:'~14h', t:'Patio de Tango na Plaza Dorrego', d:'Tango de rua aos domingos. Curto e espontâneo, sem tango-show noturno.', m:'Plaza Dorrego San Telmo'},\n   {h:'Opção · 15h', t:'Día del Niño na Floralis Genérica', d:'Plaza de las Naciones Unidas, Av. Figueroa Alcorta 2301, Recoleta. Gratuito, das 12h às 18h, ao ar livre. Zonas de jogos interativos, jogos de mesa, zona criativa, zona de movimento, plaza blanda para os menores, zona chill, gastronomia, stand de educação no trânsito, Reparamóvil de brinquedos e \"Soltate\", para aprender a andar de bicicleta. No palco: 12h30 projeção do filme \"Dibu Martínez, el pibe que ataja el tiempo\", 14h Monster Buu Band, 15h05 Urraka, 15h45 Anilú e 17h Topa ao vivo. Saindo de San Telmo por volta das 14h30 dá para pegar Urraka, Anilú e o show do Topa — e fica no caminho de casa.', o:true, p:'grátis', m:'Plaza de las Naciones Unidas Floralis Generica Buenos Aires'},\n   {h:'~16h', t:'Museo Moderno', d:'Av. San Juan 350, quatro quadras da Plaza Dorrego. Programação de Día del Niño com teatro, cinema e música. Coberto.', m:'Museo de Arte Moderno de Buenos Aires San Juan 350'},\n   {h:'Opção', t:'Mundial del Alfajor', d:'BA Ferial, 12h às 20h. 120 expositores e área infantil. Táxi de ~20 min desde San Telmo.', o:true, p:'ARS 7.000 adulto', m:'BA Ferial Costa Salguero Buenos Aires'},\n   {h:'Opção', t:'Planetário · Veo veo ou Top 5', d:'16h para 3–6 anos, 17h30 para 6–10. Não se suspende por chuva e fica a minutos de casa.', o:true, p:'ARS 12.000/pes.', m:'Planetario Galileo Galilei Buenos Aires'}\n  ],\n  chuva:[\n   {h:'10h30', t:'Direto ao Mercado de San Telmo', d:'Coberto. Comece por dentro e saia para a feira nas janelas sem chuva.', m:'Mercado de San Telmo Buenos Aires'},\n   {h:'~12h', t:'Mafalda entre pancadas', d:'A estátua fica a duas quadras. Cinco minutos resolvem a foto.', m:'Estatua Mafalda Chile y Defensa San Telmo'},\n   {h:'~14h30', t:'Museo Moderno — o plano de chuva do dia', d:'Quatro quadras a pé, coberto, com programação familiar de Día del Niño. É a alternativa padrão.', m:'Museo de Arte Moderno de Buenos Aires San Juan 350'},\n   {h:'~17h', t:'Volta, banho quente e Planetário', d:'Troca de roupa no apartamento e Planetário a minutos dali. Não fecha com chuva.', o:true, p:'ARS 12.000/pes.', m:'Planetario Galileo Galilei Buenos Aires'}\n  ],\n  aviso:'A festa da Floralis é ao ar livre e, em caso de chuva, é remarcada para sábado 29 de agosto — depois da viagem. Ou seja: ela só existe se o domingo abrir. Decida na hora, olhando o céu, e mantenha o Museo Moderno como plano coberto. Os telescópios gratuitos das 19h no Planetário também dependem de céu limpo; com 73% de chuva, considere cancelados e não crie expectativa nas crianças.'},\n\n {id:17, dow:'Segunda', data:'17 ago', iso:'2026-08-17', eixo:'Temaikèn', intensidade:'Alta — o único dia longo', clima:'12–14° · ver ao vivo',\n  resumo:'Feriado nacional, então o parque abre. Na base de 08/08 eram 2 mm — chuvisco, não temporal —, mas confira o painel ao vivo na véspera: com chuva fraca o dia se faz com capa; com temporal, o plano B do Alfajor entra.',\n  seco:[\n   {h:'8h30', t:'Saída de Palermo', d:'Linha 194 sai da Av. Sarmiento, em frente à La Rural: 9h00, 9h40 ou 10h20. Ou van privativa.', m:'Plaza Italia Av Sarmiento La Rural Buenos Aires'},\n   {h:'10h', t:'Chegada ao Bioparque', d:'Aberto 10h às 18h, entrada até 17h. Animais, áreas de conservação e o grande aquário.', p:'ARS 504.270', m:'Bioparque Temaiken Escobar'},\n   {h:'~12h', t:'Planeta Vida', d:'Cinema 360° em 12K com som envolvente e efeitos sensoriais. Sessões entre 12h e 17h. Coberto.', m:'Bioparque Temaiken Escobar'},\n   {h:'16h30/17h', t:'Retorno', d:'Não precisa ficar até fechar. Retornos da 194: 16h40, 17h20 e 18h00.', m:'Bioparque Temaiken Escobar'},\n   {h:'Opção · ~17h30', t:'Via Flaminia, no caminho de volta', d:'Urquiza 919, esquina Av. del Libertador, em Acassuso — Zona Norte, na descida do Temaikèn para a cidade. Heladería histórica famosa pelo cucurucho banhado em chocolate de até 70 cm, o mais alto da Argentina. Com o transfer privativo, é um desvio de poucos minutos; num ônibus de linha, não vale. Peça ao motorista para parar na ida ou na volta.', o:true, m:'Via Flaminia Urquiza 919 Acassuso San Isidro'},\n   {h:'Noite', t:'Jantar tranquilo perto de casa', d:'Depois de um dia inteiro fora, nada de deslocamento.', m:'Fitz Roy 2428 Palermo'}\n  ],\n  chuva:[\n   {h:'8h30', t:'Van privativa, não a linha 194', d:'Esperar ônibus na chuva com dez pessoas estraga o dia antes de começar. Grupo Summa opera desde CABA.', m:'Plaza Italia Buenos Aires'},\n   {h:'10h', t:'Temaikèn com plano de cobertura', d:'Aquário e Planeta Vida como refúgios. Capa de chuva para todos — guarda-chuva não funciona com rajada de 47 km/h.', p:'ARS 504.270', m:'Bioparque Temaiken Escobar'},\n   {h:'Plano B', t:'Se virar temporal: Mundial del Alfajor', d:'Último dos três dias do evento, 12h às 20h, coberto. Decida na véspera, olhando a previsão de 16/08.', o:true, p:'ARS 7.000 adulto', m:'BA Ferial Costa Salguero Buenos Aires'}\n  ],\n  aviso:'Compre os ingressos do Temaikèn online e antecipado: o parque trabalha com capacidade limitada e 17/08 é feriado. A regra de um adulto para cada três menores está atendida com folga: cinco adultos para cinco menores.'},\n\n {id:18, dow:'Terça', data:'18 ago', iso:'2026-08-18', eixo:'Barrio Chino e Jardín Japonés', intensidade:'Média', clima:'8–12° · ver ao vivo',\n  resumo:'Era o dia mais seco na previsão fechada em 8 de agosto, e por isso ficou com o que é ao ar livre. Confirme no painel de previsão acima antes de sair: se a leitura ao vivo virar chuva, o Colón Fábrica e o Planetário assumem o dia e nenhum dos dois fecha com chuva. Tudo aqui fica a poucos minutos do apartamento.',\n  seco:[\n   {h:'10h30', t:'Barrio Chino, Belgrano', d:'Entrada pelo arco em Juramento com Arribeños. Supermercados asiáticos, lojas de mangá e anime.', m:'Barrio Chino Belgrano Arribeños Buenos Aires'},\n   {h:'12h', t:'Vía Viva ou Pasaje Echeverría', d:'Pequenas propostas gastronômicas, muitas sem serviço de mesa, feitas para compartilhar. Melhor que restaurante formal para dez.', m:'Pasaje Echeverria Belgrano Buenos Aires'},\n   {h:'14h', t:'Jardín Japonés', d:'Aberto todos os dias, 10h às 19h, bilheteria até 18h. Cerca de 1h15. Vejam o Salón Tokyo, com quimonos e instrumentos.', p:'ARS 13.500 a 24.000', m:'Jardin Japones Buenos Aires'},\n   {h:'~15h30', t:'Rosedal e Bosques de Palermo', d:'Gratuito, terça a domingo até 18h, entrada até 17h. Bloco leve e cortável sem culpa.', o:true, m:'El Rosedal de Palermo Buenos Aires'},\n   {h:'16h', t:'Planetário · visita guiada ao museu', d:'Terça a sexta às 12h e 16h. Meteoritos reais, rochas lunares, plaza astronómica. Não se suspende por chuva.', o:true, m:'Planetario Galileo Galilei Buenos Aires'}\n  ],\n  chuva:[\n   {h:'10h30', t:'Barrio Chino mesmo assim', d:'É basicamente comércio de rua com muitas lojas — funciona sob chuva leve.', m:'Barrio Chino Belgrano Arribeños Buenos Aires'},\n   {h:'15h', t:'Colón Fábrica de graça', d:'Recorrido livre gratuito às terças, 15h às 17h, ticket na bilheteria no mesmo dia. Cenários e figurinos originais do Teatro Colón — mais visual para crianças que museu convencional.', p:'grátis', m:'Colon Fabrica Av Don Pedro de Mendoza 2163'},\n   {h:'Alternativa', t:'Teatro Colón guiado', d:'Visitas todos os dias, 10h às 16h45, saída a cada 15 min. Há visitas em português às 11h45 e 16h. Cerca de 50 min.', o:true, p:'ARS 34.000', m:'Teatro Colon Buenos Aires'}\n  ],\n  aviso:'Jardín Japonés, três coisas apuradas em 13/08. (1) A gratuidade de menores de 12 NÃO é restrita a argentinos: o regulamento especifica nacionalidade só na regra dos idosos, então o DNI ali serve para provar idade, e passaporte cumpre a mesma função. Miguel, Luiza e Paulo Victor devem entrar de graça. (2) Noêmia e Domingos PAGAM: a gratuidade acima de 65 vale apenas para argentinos e residentes permanentes com DNI argentino. (3) Sophia tem 12, não é menor de 12, e paga. Preço em conflito entre fontes: a página em inglês do jardim traz 13.500 e a Nación de julho traz 24.000. Orce pelo maior. WhatsApp de informes: 1122572130.'},\n\n {id:19, dow:'Quarta', data:'19 ago', iso:'2026-08-19', eixo:'Manhã gastronômica e saída', intensidade:'Baixa', clima:'5–11° · ver ao vivo',\n  resumo:'Voo às 17h de Ezeiza, para os dez. Sem ingresso, sem deslocamento longo — a manhã inteira cabe em três quarteirões de Palermo.',\n  seco:[\n   {h:'9h', t:'Café da manhã em Palermo', d:'Ninina funciona bem para dez pessoas com pedidos diferentes.', m:'Ninina Gorriti 4738 Buenos Aires'},\n   {h:'Alternativa', t:'La Panera Rosa · Palermo Soho', d:'Jorge Luis Borges 1689, a filial mais perto do apartamento — cerca de 800 m, dez minutos a pé. Cozinha non-stop: café, brunch, almoço, merienda e jantar na mesma carta, com panquecas, waffles, crepes e confeitaria própria ao lado de pratos salgados e 58.42], 12);\n      const grupo = this._grupo || (this._grupo = L.layerGroup().addTo(this._map));\n      grupo.clearLayers();\n      const dia = this.state.tudo ? null : this.state.atual;\n      const visiveis = LUGARES.filter(p => dia === null || p.dias.indexOf(dia) >= 0);\n      const marcas = LUGARES.map(p => {\n        const on = visiveis.indexOf(p) >= 0;\n        const m = L.circleMarker([p.lat, p.lng], {\n          radius: on ? 9 : 5, color: '#16202B', weight: 2,\n          fillColor: p.cor, fillOpacity: on ? 1 : 0.3, opacity: on ? 1 : 0.3\n        });\n        m.on('click', () => this.setState({ pin: p.id }));\n        grupo.addLayer(m);\n        return { p, m, on };\n      });\n      const alvo = dia === null ? LUGARES.filter(p => !p.fora) : visiveis.filter(p => p.enquadra !== false);\n      const foco = (alvo.length ? alvo : visiveis).map(p => [p.lat, p.lng]);\n      try {\n        this._map.invalidateSize();\n        if (foco.length) this._map.fitBounds(foco, { padding: [46, 46], maxZoom: 15, animate: false });\n      } catch (e2) { console.warn('enquadramento', e2); }\n      const usados = [];\n      marcas.forEach(({ p, m, on }) => {\n        const dir = p.dir || 'top';\n        const off = dir === 'top' ? [0, -8] : dir === 'bottom' ? [0, 8] : dir === 'left' ? [-8, 0] : [8, 0];\n        let fixo = false;\n        if (on && dia !== null) {\n          const pt = this._map.latLngToContainerPoint([p.lat, p.lng]);\n          fixo = usados.every(u => Math.abs(u.x - pt.x) > 96 || Math.abs(u.y - pt.y) > 26);\n          if (fixo) usados.push(pt);\n        }\n        m.bindTooltip(p.nome, { permanent: fixo, direction: dir, offset: off, sticky: !fixo });\n      });\n      // conferência sobre os retângulos reais: quem ainda cruzar vira rótulo de hover\n      requestAnimationFrame(() => {\n        try {\n          const aceitos = [];\n          marcas.forEach(({ p, m }) => {\n            const tt = m.getTooltip();\n            if (!tt || !tt.options.permanent || !tt._container) return;\n            const r = tt._container.getBoundingClientRect();\n            const cruza = aceitos.some(a => r.left < a.right && r.right > a.left && r.top < a.bottom && r.bottom > a.top);\n            if (cruza) {\n              const dir = p.dir || 'top';\n              const off = dir === 'top' ? [0, -8] : dir === 'bottom' ? [0, 8] : dir === 'left' ? [-8, 0] : [8, 0];\n              m.unbindTooltip();\n              m.bindTooltip(p.nome, { permanent: false, sticky: true, direction: dir, offset: off });\n            } else {\n              aceitos.push(r);\n            }\n          });\n        } catch (e3) { console.warn('rotulos', e3); }\n      });\n    } catch (e) { console.error('mapa', e); }\n  }\n\n  gerarCodigo() {\n    const { pessoa, notas, tarefas, extras } = this.state;\n    if (!pessoa.trim()) { this.setState({ aviso: 'Escreva seu nome antes de gerar o código.' }); return; }\n    const pacote = { v: 1, quem: pessoa.trim(), em: new Date().toISOString().slice(0, 10), notas, tarefas, extras };\n    let cod = '';\n    try { cod = btoa(unescape(encodeURIComponent(JSON.stringify(pacote)))); }\n    catch (e) { this.setState({ aviso: 'Não foi possível gerar o código.' }); return; }\n    this.setState({ codigo: cod, aviso: 'Código pronto. Copie e mande no grupo da família.' });\n    try { navigator.clipboard.writeText(cod); } catch (e) {}\n  }\n\n  juntarCodigo() {\n    const txt = (this.state.colar || '').trim();\n    if (!txt) { this.setState({ aviso: 'Cole o código que a pessoa te mandou.' }); return; }\n    let p;\n    try { p = JSON.parse(decodeURIComponent(escape(atob(txt)))); }\n    catch (e) { this.setState({ aviso: 'Esse código não parece válido. Confira se veio inteiro.' }); return; }\n    if (!p || !p.quem) { this.setState({ aviso: 'Código sem identificação de quem enviou.' }); return; }\n    const eq = { ...this.state.equipe, [p.quem]: { em: p.em || '', notas: p.notas || {}, tarefas: p.tarefas || {}, extras: p.extras || {} } };\n    this.salvar({ equipe: eq, colar: '', aviso: 'Anotações de ' + p.quem + ' adicionadas ao quadro.' });\n  }\n\n  removerDaEquipe(quem) {\n    const eq = { ...this.state.equipe }; delete eq[quem];\n    this.salvar({ equipe: eq, aviso: '' });\n  }\n\n  salvar(patch) {\n    this.setState(patch, () => {\n      const { modo, extras, notas, tarefas, valores, ligados, cambio, pessoa, equipe } = this.state;\n      try { localStorage.setItem(CHAVE, JSON.stringify({ modo, extras, notas, tarefas, valores, ligados, cambio, pessoa, equipe })); } catch (e) {}\n    });\n  }\n\n  async buscarClima() {\n    const url = 'https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816'\n      + '&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,precipitation_probability_max'\n      + '&timezone=America%2FArgentina%2FBuenos_Aires&start_date=2026-08-14&end_date=2026-08-19';\n    try {\n      const r = await fetch(url);\n      const j = await r.json();\n      const dd = j.daily;\n      if (!dd || !dd.time) throw new Error('sem dados');\n      const map = {};\n      dd.time.forEach((t, i) => {\n        map[t] = {\n          min: Math.round(dd.temperature_2m_min[i]),\n          max: Math.round(dd.temperature_2m_max[i]),\n          mm: dd.precipitation_sum[i],\n          prob: dd.precipitation_probability_max[i]\n        };\n      });\n      this.setState({ live: map, liveEm: new Date(), liveErro: false });\n    } catch (e) { this.setState({ liveErro: true }); }\n  }\n\n  cor(prob) { return prob >= 70 ? CARMIN : prob >= 40 ? COBALTO : VERDE; }\n  fundo(prob) { return prob >= 70 ? 'rgba(178,31,44,.14)' : prob >= 40 ? 'rgba(27,79,156,.16)' : 'rgba(14,92,70,.14)'; }\n\n  renderVals() {\n    const st = this.state;\n    const dia = DIAS.find(d => d.id === st.atual) || DIAS[0];\n    const modo = st.modo[dia.id] || 'seco';\n    const base = dia[modo] || dia.seco;\n    const extras = (st.extras[dia.id] || []).map((s, i) => ({ ...s, custom: true, idx: i }));\n\n    const paradas = base.concat(extras).map((s, i) => ({\n      h: s.h, t: s.t, d: s.d || '', p: s.p || '',\n      mapa: mapsUrl(s.m || (s.t + ' Buenos Aires')),\n      cor: s.o ? COBALTO : CARMIN,\n      dotStyle: s.o ? 'dashed' : 'solid',\n      custom: !!s.custom,\n      onDel: s.custom ? () => {\n        const ex = { ...st.extras }; const lista = (ex[dia.id] || []).slice();\n        lista.splice(s.idx, 1); ex[dia.id] = lista; this.salvar({ extras: ex });\n      } : null\n    }));\n\n    const clima = CLIMA_BASE.map(c => {\n      const d = DIAS.find(x => x.id === c.id);\n      const ao = st.live && st.live[d.iso];\n      const v = ao || c;\n      const prob = v.prob || 0, mm = v.mm || 0;\n      return {\n        rot: c.rot,\n        temp: v.min + '–' + v.max + '°',\n        label: prob >= 40 ? prob + '% · ' + String(mm).replace('.', ',') + ' mm' : (prob > 0 ? prob + '%' : 'seco'),\n        bg: this.fundo(prob), fg: this.cor(prob),\n        origem: ao ? 'ao vivo' : 'base 08/08'\n      };\n    });\n\n    const custos = CUSTOS.map(c => {\n      const on = st.ligados[c.id] === undefined ? c.on : st.ligados[c.id];\n      const v = st.valores[c.id] === undefined ? c.v : st.valores[c.id];\n      return {\n        n: c.n, on, op: on ? 1 : 0.42, edit: !!c.edit, fixo: !c.edit,\n        v: v || '', vf: nf(v), ph: c.ph || '',\n        onToggle: e => this.salvar({ ligados: { ...st.ligados, [c.id]: e.target.checked } }),\n        onValor: e => this.salvar({ valores: { ...st.valores, [c.id]: Number(e.target.value) || 0 } })\n      };\n    });\n    const total = custos.filter(c => c.on).reduce((a, c) => a + (Number(c.v) || 0), 0);\n    const cambio = st.cambio === null || st.cambio === undefined ? 0.004 : st.cambio;\n\n    const diaEnfase = st.tudo ? null : st.atual;\n\n    return {\n      mostrarMapa: this.props.mostrarMapa !== false,\n      mostrarCustos: this.props.mostrarCustos !== false,\n\n      clima,\n      climaFonte: st.live\n        ? 'Previsão ao vivo (Open-Meteo), relida sozinha a cada 10 minutos enquanto a página estiver aberta. A base do relatório de 08/08 entra só se a rede falhar.'\n        : (st.liveErro ? 'Sem rede: mostrando a base do relatório de 8 de agosto (Climatempo).' : 'Carregando previsão ao vivo…'),\n      recarregarClima: () => { this.setState({ live: null, liveErro: false }); this.buscarClima(); },\n\n      dias: DIAS.map(d => ({\n        tab: d.dow + ' ' + d.data.split(' ')[0],\n        eixo: d.eixo,\n        bg: d.id === st.atual ? TINTA : CREME,\n        fg: d.id === st.atual ? CREME : TINTA,\n        onClick: () => this.setState({ atual: d.id, tudo: false, novo: { h: '', t: '', d: '' } })\n      })),\n\n      diaCabecalho: dia.dow + ' · ' + dia.data + ' · ' + (() => {\n        const ao = st.live && st.live[dia.iso];\n        if (!ao) return dia.clima + ' (base 08/08)';\n        const prob = ao.prob || 0, mm = ao.mm || 0;\n        return ao.min + '–' + ao.max + '° · ' + (prob >= 40\n          ? prob + '% de chuva, ' + String(mm).replace('.', ',') + ' mm'\n          : (prob > 0 ? prob + '% de chuva' : 'seco')) + ' · ao vivo';\n      })(),\n      diaDivergiu: (() => {\n        const ao = st.live && st.live[dia.iso];\n        const base = CLIMA_BASE.find(c => c.id === dia.id);\n        if (!ao || !base) return '';\n        const faixa = p => p >= 70 ? 3 : p >= 40 ? 2 : 1;\n        if (faixa(ao.prob || 0) === faixa(base.prob)) return '';\n        return 'Mudou desde 08/08: a previsão ao vivo marca ' + (ao.prob || 0) + '% de chuva e '\n          + String(ao.mm || 0).replace('.', ',') + ' mm, contra ' + base.prob + '% e '\n          + String(base.mm).replace('.', ',') + ' mm na base do relatório. O texto abaixo foi escrito com a base — decida pelo número de agora.';\n      })(),\n      diaEixo: dia.eixo, diaResumo: dia.resumo, diaIntensidade: dia.intensidade, diaAviso: dia.aviso,\n      paradas,\n      secoBg: modo === 'seco' ? COBALTO : CREME, secoFg: modo === 'seco' ? '#fff' : TINTA,\n      chuvaBg: modo === 'chuva' ? COBALTO : CREME, chuvaFg: modo === 'chuva' ? '#fff' : TINTA,\n      verSeco: () => this.salvar({ modo: { ...st.modo, [dia.id]: 'seco' } }),\n      verChuva: () => this.salvar({ modo: { ...st.modo, [dia.id]: 'chuva' } }),\n\n      novoH: st.novo.h, novoT: st.novo.t, novoD: st.novo.d,\n      setNovoH: e => this.setState({ novo: { ...st.novo, h: e.target.value } }),\n      setNovoT: e => this.setState({ novo: { ...st.novo, t: e.target.value } }),\n      setNovoD: e => this.setState({ novo: { ...st.novo, d: e.target.value } }),\n      addParada: () => {\n        const n = st.novo;\n        if (!n.t.trim()) return;\n        const ex = { ...st.extras };\n        ex[dia.id] = (ex[dia.id] || []).concat([{ h: n.h.trim() || 'Livre', t: n.t.trim(), d: n.d.trim(), m: n.t.trim() + ' Buenos Aires' }]);\n        this.salvar({ extras: ex, novo: { h: '', t: '', d: '' } });\n      },\n\n      fotos: (FOTOS[dia.id] || []).map(x => ({ src: cm(x.f), t: x.t, c: x.c })),\n      coberto: (COBERTO[dia.id] || []).map(c => ({ t: c.t, d: c.d })),\n      cobertoNota: dia.id === 17\n        ? 'Segunda é dia contratado: o abrigo está dentro do próprio parque.'\n        : 'Tudo aqui é coberto e fica perto do que o dia já faz. Chuva fraca não cancela rua — serve para os picos.',\n\n      nota: st.notas[dia.id] || '',\n      notasFamilia: Object.entries(st.equipe || {})\n        .filter(([q, d]) => (d.notas || {})[dia.id])\n        .map(([q, d]) => ({ quem: q, texto: d.notas[dia.id], em: d.em || '' })),\n      temNotasFamilia: Object.entries(st.equipe || {}).some(([q, d]) => (d.notas || {})[dia.id]),\n      setNota: e => this.salvar({ notas: { ...st.notas, [dia.id]: e.target.value } }),\n\n      adultos: VIAJANTES.filter(v => v.idade >= 18).map(v => ({ nome: v.nome })),\n      criancas: VIAJANTES.filter(v => v.idade < 18).map(v => ({ nome: v.nome, nasc: v.nasc, idade: v.idade })),\n\n      mapaRef: this.mapaRef,\n      pinInfo: st.pin ? (LUGARES.find(p => p.id === st.pin) || {}).info : 'Nenhum ponto selecionado.',\n      verTudo: () => this.setState({ tudo: true, pin: null }),\n\n      custos, cambio,\n      setCambio: e => this.salvar({ cambio: Number(e.target.value) || 0 }),\n      totalArs: 'ARS ' + nf(total),\n      totalBrl: cambio > 0 ? '≈ R$ ' + (total * cambio).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) : '',\n\n      tarefas: TAREFAS.map(t => {\n        const on = !!st.tarefas[t.id];\n        return {\n          p: t.p, t: t.t, on, deco: on ? 'line-through' : 'none', op: on ? 0.45 : 1,\n          onToggle: e => this.salvar({ tarefas: { ...st.tarefas, [t.id]: e.target.checked } }),\n          quem: Object.entries(st.equipe || {}).filter(([q, d]) => (d.tarefas || {})[t.id]).map(([q]) => q).join(', '),\n          temQuem: Object.entries(st.equipe || {}).some(([q, d]) => (d.tarefas || {})[t.id])\n        };\n      }),\n      limparTarefas: () => this.salvar({ tarefas: {} }),\n\n      pessoa: st.pessoa,\n      setPessoa: e => this.salvar({ pessoa: e.target.value }),\n      colar: st.colar,\n      setColar: e => this.setState({ colar: e.target.value }),\n      codigo: st.codigo,\n      temCodigo: !!st.codigo,\n      gerar: () => this.gerarCodigo(),\n      juntar: () => this.juntarCodigo(),\n      aviso: st.aviso,\n      temAviso: !!st.aviso,\n      equipe: Object.entries(st.equipe || {}).map(([q, d]) => ({\n        quem: q,\n        resumo: Object.keys(d.notas || {}).length + ' dias anotados · ' + Object.values(d.tarefas || {}).filter(Boolean).length + ' tarefas marcadas' + (d.em ? ' · ' + d.em.split('-').reverse().join('/') : ''),\n        remover: () => this.removerDaEquipe(q)\n      })),\n      temEquipe: Object.keys(st.equipe || {}).length > 0,\n\n      carimbo: st.liveEm\n        ? 'Previsão lida em ' + st.liveEm.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' · suas marcações ficam salvas neste navegador'\n        : 'Suas marcações ficam salvas neste navegador',\n      imprimir: () => window.print()\n    };\n  }\n}\n\n<\/script>\n\n\n<\/body><\/html>"
